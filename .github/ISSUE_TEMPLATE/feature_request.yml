name: Feature request
description: Propose a scoped, evidence-driven improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Data, algorithm, mobile, and safety impact
      description: Explain provenance, validation, offline behavior, and failure boundaries.
    validations:
      required: true

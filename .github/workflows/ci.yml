name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit==2.10.1
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r backend/requirements.txt
      - name: Backend contract and tests
        run: bash scripts/check_backend.sh
      - name: Five-baseline wiring smoke
        run: python scripts/smoke_all_baselines.py --timesteps 128 --output /tmp/portai-smoke

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get
      - name: Format, analyze, and test
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub --reporter compact
      - name: Build release Web client
        run: flutter build web --release --no-pub

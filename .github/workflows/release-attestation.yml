name: release-attestation

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  source:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output=dist/dt-mobile-app-${GITHUB_REF_NAME}.tar.gz HEAD
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/dt-mobile-app-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Attest source provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dt-mobile-app-${{ github.ref_name }}.tar.gz
      - name: Attest source SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dt-mobile-app-${{ github.ref_name }}.tar.gz
          sbom-path: dist/dt-mobile-app-${{ github.ref_name }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dt-mobile-app-${{ github.ref_name }}
          path: dist/

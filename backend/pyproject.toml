[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "portai-real-rl"
version = "3.0.0"
description = "Dataset-driven headless RL and held-out replay backend for PortAI mobile"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.5",
  "numpy==1.26.4",
  "gymnasium==1.3.0",
  "stable-baselines3==2.9.0",
  "torch==2.13.0",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["portai_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

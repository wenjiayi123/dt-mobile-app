name: dt_mobile_app
description: "Evidence-aware port digital twin client with headless RL training and held-out replay."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  flutter_riverpod: ^3.4.2

  dio: ^5.11.0
  web_socket_channel: ^3.0.3

  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/xiaoyi_maritime_officer.png
  fonts:
    - family: PortAISansSC
      fonts:
        - asset: assets/fonts/PortAISansSC.ttf
